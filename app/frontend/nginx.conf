
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://employee-api.apps.svc.cluster.local:8000;
    }

    location = /employee-health {
        proxy_pass http://employee-api.apps.svc.cluster.local:8000/health;
    }

    location /troubleshooter/ {
        proxy_pass http://troubleshooter-agent.apps.svc.cluster.local:8000/;
    }
}
