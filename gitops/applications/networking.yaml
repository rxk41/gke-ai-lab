
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-lab-networking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rxk41/gke-ai-lab
    targetRevision: main
    path: gitops/networking
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
