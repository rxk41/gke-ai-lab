
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rxk41/gke-ai-lab.git
    targetRevision: main
    path: gitops/apps/employee-api

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
