
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: troubleshooter-agent
  namespace: argocd
spec:
  project: default

  source:
    repoURL: REPLACE_WITH_YOUR_REPO_URL
    targetRevision: main
    path: gitops/apps/troubleshooter-agent

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
