
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
    spec:
      serviceAccountName: employee-api-ksa
      containers:
        - name: employee-api
          image: us-central1-docker.pkg.dev/k8s-learning-510807/gitops-apps/employee-api:b9f9d31009562b1c1512ee6c23f17a9d02531915-v1.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TROUBLESHOOTER_URL
              value: "https://troubleshooter-agent-krebtafpnq-uc.a.run.app"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---

apiVersion: v1
kind: Service
metadata:
  name: employee-api
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: employee-api
  ports:
    - name: http
      port: 80
      targetPort: http
