
apiVersion: v1
kind: ServiceAccount
metadata:
  name: troubleshooter-agent
  namespace: apps
  # Add the GKE Workload Identity annotation after configuring
  # a dedicated Google service account for the agent.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooter-agent
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: troubleshooter-agent
  template:
    metadata:
      labels:
        app: troubleshooter-agent
    spec:
      serviceAccountName: troubleshooter-agent
      containers:
        - name: troubleshooter-agent
          image: us-central1-docker.pkg.dev/k8s-learning-510807/gitops-apps/troubleshooter-agent:REPLACE_WITH_COMMIT_SHA
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: "k8s-learning-510807"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: troubleshooter-agent
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: troubleshooter-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
