apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-lab-route
  namespace: apps

spec:
  parentRefs:
    - name: ai-lab-gateway

  rules:

    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: employee-api
          port: 8000

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080