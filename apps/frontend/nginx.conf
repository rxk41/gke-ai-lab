
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    location /troubleshooter/ {
    proxy_pass http://employee-api.apps.svc.cluster.local:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://employee-api.apps.svc.cluster.local:8000;
    }

    location = /employee-health {
        proxy_pass http://employee-api.apps.svc.cluster.local:8000/health;
    }
}
