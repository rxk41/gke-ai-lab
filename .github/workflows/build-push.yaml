
name: Build and Push Images

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Application version (example: v1.1)"
        required: true
        default: "v1.1"
        type: string

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.AR_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - employee-api
          - troubleshooter-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}-${{ inputs.app_version }}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${{ matrix.app }}:${IMAGE_TAG}"

          docker build \
            -f apps/${{ matrix.app }}/Dockerfile \
            -t "$IMAGE" \
            apps/${{ matrix.app }}

      - name: Push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${{ matrix.app }}:${IMAGE_TAG}"

          docker push "$IMAGE"

  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update deployment manifests
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ inputs.app_version }}
          IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          image_base = os.environ["IMAGE_BASE"]
          image_tag = os.environ["IMAGE_TAG"]

          manifests = {
              "frontend": "gitops/apps/frontend/deployment.yaml",
              "employee-api": "gitops/apps/employee-api/deployment.yaml",
              "troubleshooter-agent": "gitops/apps/troubleshooter-agent/deployment.yaml",
          }

          for app, filename in manifests.items():
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(f"Missing manifest: {filename}")

              lines = path.read_text().splitlines(keepends=True)
              matches = 0

              for i, line in enumerate(lines):
                  if "image:" in line and f"/{app}:" in line:
                      indent = line.split("image:", 1)[0]
                      lines[i] = (
                          f"{indent}image: {image_base}/{app}:{image_tag}\n"
                      )
                      matches += 1

              if matches != 1:
                  raise SystemExit(
                      f"Expected one image entry for {app}; found {matches}"
                  )

              path.write_text("".join(lines))
              print(f"Updated {filename}")

          PY

      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/*/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "chore(gitops): update images to ${IMAGE_TAG}"
          git push origin HEAD:main
