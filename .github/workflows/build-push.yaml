
name: Build and Push Images

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  build-push:
    name: Build and Push ${{ matrix.app }}

    # Do not build if validation failed or was cancelled.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - employee-api
          - troubleshooter-agent

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate with Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            ${{ vars.GCP_REGION }}-docker.pkg.dev \
            --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.AR_REPOSITORY }}
          APP: ${{ matrix.app }}
          IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${APP}"

          docker build \
            -f "apps/${APP}/Dockerfile" \
            -t "${IMAGE}:${IMAGE_TAG}" \
            "apps/${APP}"

          docker push "${IMAGE}:${IMAGE_TAG}"

          echo "Pushed ${IMAGE}:${IMAGE_TAG}"
