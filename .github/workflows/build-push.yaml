
name: Build and Push Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    name: Build and Push ${{ matrix.app }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - employee-api
          - troubleshooter-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            ${{ vars.GCP_REGION }}-docker.pkg.dev \
            --quiet

      - name: Build and push Docker image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.AR_REPOSITORY }}
          APP: ${{ matrix.app }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${APP}"

          echo "Building image: ${IMAGE}:${IMAGE_TAG}"

          docker build \
            -f "apps/${APP}/Dockerfile" \
            -t "${IMAGE}:${IMAGE_TAG}" \
            "apps/${APP}"

          docker push "${IMAGE}:${IMAGE_TAG}"

          echo "Successfully pushed: ${IMAGE}:${IMAGE_TAG}"
