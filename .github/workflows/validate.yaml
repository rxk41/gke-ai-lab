
name: Validate

on:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - "apps/employee-api/**"
      - "apps/troubleshooter-agent/**"
      - ".github/workflows/validate.yml"


permissions:
  contents: read

jobs:

  # Frontend validation
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  # Python application validation
  validate-python:
    name: Test ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - employee-api
          - troubleshooter-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/${{ matrix.app }}/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/${{ matrix.app }}
        run: |
          pytest apps/${{ matrix.app }}/tests -q
